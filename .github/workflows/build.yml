name: Build Recovery App
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n1)"
          test -n "$ZIP"
          rm -rf app
          mkdir -p app
          unzip -q "$ZIP" -d app
          test -f app/package.json
          test -f app/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Verify production app
        working-directory: app
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          python3 -m http.server 4173 --directory dist >/tmp/recovery-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/recovery-index.html; then
              break
            fi
            sleep 1
          done
          grep -q '<script' /tmp/recovery-index.html
          echo "Production app responds successfully."

      - name: Package production app
        shell: bash
        run: |
          set -euo pipefail
          cd app
          zip -qr ../recovery-web.zip dist
          test -s ../recovery-web.zip

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-web
          path: recovery-web.zip
          if-no-files-found: error
