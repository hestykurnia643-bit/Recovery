name: Build Recovery Android App
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n1)"
          test -n "$ZIP"
          rm -rf app
          mkdir -p app
          unzip -q "$ZIP" -d app
          test -f app/package.json
          test -f app/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Build web application
        working-directory: app
        run: npm run build

      - name: Verify web application
        working-directory: app
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          python3 -m http.server 4173 --directory dist >/tmp/recovery-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/tmp/recovery-index.html; then
              break
            fi
            sleep 1
          done
          grep -q '<script' /tmp/recovery-index.html

      - name: Add Android wrapper
        working-directory: app
        run: |
          set -euo pipefail
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --save --legacy-peer-deps
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.photorecovery.recovery",
            "appName": "Photo Recovery",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK: $APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-recovery-android-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Package web production build
        shell: bash
        run: |
          set -euo pipefail
          cd app
          zip -qr ../recovery-web.zip dist
          test -s ../recovery-web.zip

      - name: Upload web production artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-web
          path: recovery-web.zip
          if-no-files-found: error
